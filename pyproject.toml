[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.backends.legacy:build"

[project]
name = "job-scraper"
version = "1.0.0"
description = "Async job & internship scraper with CLI interface"
authors = [{ name = "Marios Giannoulis", email = "marios@mariosgian.com" }]
requires-python = ">=3.11"
readme = "README.md"
license = { text = "MIT" }

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.mypy]
strict = true
python_version = "3.11"
